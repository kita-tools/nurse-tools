<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>紹介QRコード｜NsTools</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/qr.css">
</head>


<body>


<div class="box">


<h2>
NsTools
</h2>



<div id="qrcode"></div>



<!-- Android・PCなど -->

<div id="installArea">

<button class="install" onclick="installApp()">

📲 インストール

</button>

</div>



<!-- iPhone・iPad -->

<div id="iphoneArea" style="display:none;">

<div class="iphone-guide">

<h3>📱 ホーム画面に追加</h3>

<p>
iPhone・iPadでは、Safariから<br>
ホーム画面に追加してください。
</p>

<p>
① Safariでこのページを開く
</p>

<p>
② 画面下の「共有」ボタンをタップ
</p>

<p>
③ 「ホーム画面に追加」をタップ
</p>

<p>
④ 「追加」をタップ
</p>

</div>

</div>



<br>



<button class="copy" onclick="copyURL()">

🔗 URLコピー

</button>

<br>

<a href="index.html" class="back-button">

🏠戻る

</a>



</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

let deferredPrompt = null;


// =====================
// iPhone・iPad判定
// =====================

function isIPhoneOrIPad(){

    return /iPhone|iPad|iPod/i.test(navigator.userAgent);

}


// =====================
// 端末による表示切り替え
// =====================

if(isIPhoneOrIPad()){

    document.getElementById("installArea").style.display = "none";

    document.getElementById("iphoneArea").style.display = "block";

}


// =====================
// インストール要求を受け取る
// =====================

window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault();

    deferredPrompt = e;

});


// =====================
// インストールボタン
// =====================

function installApp(){

    if(deferredPrompt){

        deferredPrompt.prompt();

    }else{

        alert("現在インストールできません");

    }

}


// =====================
// QRコードURL
// =====================

const url = "https://kita-tools.github.io/nurse-tools/";


// =====================
// QRコード作成
// =====================

new QRCode(

    document.getElementById("qrcode"),

    {

        text: url,

        width: 200,

        height: 200

    }

);


// =====================
// URLコピー
// =====================

function copyURL(){

    navigator.clipboard.writeText(url);

    alert("URLをコピーしました");

}

</script>

</body>

</html>
