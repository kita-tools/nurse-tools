<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>血算（CBC）</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f2f7fa;
}


header{

    background:#9c27b0;

    color:white;

    text-align:center;

    font-size:28px;

    padding:20px;

    font-weight:bold;

}



.container{

    max-width:700px;

    margin:auto;

    padding:20px;

}



.item{

    background:white;

    border-radius:12px;

    padding:12px;

    margin-bottom:12px;

    cursor:pointer;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

}



.item:hover{

    background:#f8fbff;

}



.check{

    width:22px;

    height:22px;

    vertical-align:middle;

    margin-right:10px;

}



.tube{

    color:#9c27b0;

    font-size:12px;

    margin-right:8px;

}



.short{

    display:inline-block;

    font-size:24px;

    font-weight:bold;

    vertical-align:middle;

}



.kana{

    margin-left:65px;

    margin-top:3px;

    color:#1976d2;

    font-size:12px;

    font-weight:bold;

}



.detail{

    display:none;

    margin-top:10px;

    border-top:1px solid #ddd;

    padding-top:12px;

    font-size:18px;

    line-height:1.8;

}



.title{

    font-weight:bold;

    color:#1976d2;

}



ul{

    margin-top:5px;

}



/* コピー */

.copy{

    position:fixed;

    right:15px;

    bottom:75px;

    padding:10px 16px;

    background:#4caf50;

    color:white;

    border-radius:20px;

    border:none;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 3px 8px rgba(0,0,0,.25);

}



/* 戻る */

.home{

    position:fixed;

    right:15px;

    bottom:15px;

    padding:10px 16px;

    background:#2196f3;

    color:white;

    border-radius:20px;

    text-decoration:none;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 3px 8px rgba(0,0,0,.25);

}


</style>

</head>


<body>


<header>

🩸 血算（CBC）

</header>



<div class="container" id="list">

読み込み中...

</div>


<button class="copy" onclick="copySelected()">

☑コピー

</button>



<a href="../検査一覧.html" class="home">

🔬 戻る

</a>


<script>


fetch("../data/CBC.json")


.then(res=>res.json())


.then(data=>{


const list=document.getElementById("list");


list.innerHTML="";



data.forEach(item=>{


const high=item.high.map(x=>"<li>"+x+"</li>").join("");

const low=item.low.map(x=>"<li>"+x+"</li>").join("");



list.innerHTML+=`


<div class="item">



<div onclick="toggle(this)">



<input type="checkbox" class="check" onclick="event.stopPropagation()">



<span class="tube">

●

</span>



<div class="short">

${item.shortName}

</div>



<div class="kana">

${item.name}

</div>



</div>



<div class="detail">



<div class="title">

基準値

</div>



${item.reference} ${item.unit}



<br><br>



<div class="title">

高値で考えられるもの

</div>



<ul>

${high}

</ul>



<div class="title">

低値で考えられるもの

</div>



<ul>

${low}

</ul>



<div class="title">

ワンポイント

</div>



${item.comment}



</div>


</div>


`;



});


});





function toggle(el){


const d=el.nextElementSibling;


if(d.style.display==="block"){


d.style.display="none";


}else{


d.style.display="block";


}


}




function copySelected(){


const checks=document.querySelectorAll(".check:checked");


let text=[];



checks.forEach(check=>{


const item=check.closest(".item");


const name=item.querySelector(".short").innerText;


text.push(name);


});



if(text.length===0){


alert("項目を選択してください");


return;


}



navigator.clipboard.writeText(text.join("\n"));



alert("コピーしました");


}



</script>


</body>

</html>
