<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>点滴計算</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/calc.css">
<link rel="stylesheet" href="css/drip-test.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SPCWDVP7F5"></script>

<script>

window.dataLayer = window.dataLayer || [];

function gtag(){

dataLayer.push(arguments);

}

gtag('js', new Date());

gtag('config', 'G-SPCWDVP7F5');

</script>

</head>


<body>
<div id="viewport-test"></div>

<script>
document.getElementById("viewport-test").textContent =
    "viewport幅：" + window.innerWidth + "px";
</script>

<header>

💧 点滴計算

</header>



<div class="box">


<div class="input-row">

<label>滴下量</label>

<input id="ml" type="number">

<span class="unit">mL</span>

</div>



<div class="input-row">

<label>滴下時間</label>

<input id="hour" type="number" min="0.1" step="0.1">

<span class="unit">時間</span>

</div>



<div class="input-row">

<label>滴下係数</label>

<select id="type">

<option value="20">20滴</option>

<option value="60">60滴</option>

</select>

<span class="unit">/mL</span>

</select>

</div>



<button onclick="start()">

開始

</button>



<div class="result" id="result">

輸液速度　－<br>
滴下速度　－<br>
滴下間隔　－

</div>



<div id="drop">

💧

</div>



<button id="mute" onclick="toggleMute()">

🔇

</button>


</div>



<a href="index.html" class="back-button">

🏠戻る

</a>




<script>

let timer;

let mute = true;

let audioCtx;



function start(){


    let ml =
    Number(document.getElementById("ml").value);


    let hour =
    Number(document.getElementById("hour").value);


    let drip =
    Number(document.getElementById("type").value);



    if(ml <= 0){

        alert("滴下量を入力してください");

        return;

    }



    if(isNaN(hour) || hour < 0.1){

        alert("滴下時間は0.1時間以上で入力してください");

        return;

    }



    let perMin =
    (ml * drip) / (hour * 60);



    let per10 =
    perMin / 6;



    let dropInterval =
    10000 / per10;



    document.getElementById("result").innerHTML =


    "輸液速度　"
    + (ml / hour).toFixed(1)
    + " mL/h<br>"


    +

    "滴下速度　"
    + per10.toFixed(2)
    + "滴/10秒<br>"


    +

    "滴下間隔　"
    + (dropInterval / 1000).toFixed(2)
    + "秒/滴";



    clearInterval(timer);



    drop();



    timer = setInterval(drop, dropInterval);


}





function drop(){

    let d =
    document.getElementById("drop");


    d.innerHTML = `
        <svg
            class="drip-drop"
            viewBox="0 0 100 161.8"
            aria-hidden="true"
        >

            <path
                d="
                    M50 0

                    C43 14 20 42 10 65

                    C2 83 0 94 0 108

                    C0 138 22 161.8 50 161.8

                    C78 161.8 100 138 100 108

                    C100 94 98 83 90 65

                    C80 42 57 14 50 0

                    Z
                "
                fill="#2196f3"
            />

        </svg>
    `;


    if(!mute){

        beep();

    }


    setTimeout(function(){

        d.innerHTML="";

    },150);

}





function beep(){


    if(!audioCtx){

        audioCtx = new AudioContext();

    }



    let osc = audioCtx.createOscillator();


    osc.connect(audioCtx.destination);


    osc.frequency.value=800;


    osc.start();


    osc.stop(audioCtx.currentTime + 0.05);


}





function toggleMute(){


    mute=!mute;



    document.getElementById("mute").innerHTML =

    mute ? "🔇" : "🔈";


}



</script>


</body>

</html>
