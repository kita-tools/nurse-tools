<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMI計算</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/calc.css">
</head>

<body>

<header>

🧍 BMI計算

</header>


<div class="container">

<div class="input-row">
<label>身長</label>
<input id="height" type="number">
<span class="unit">cm</span>
</div>

<div class="input-row">
<label>体重</label>
<input id="weight" type="number">
<span class="unit">kg</span>
</div>

<button onclick="calcBMI()">
計算
</button>

<button onclick="resetForm()">
リセット
</button>

<div class="result" id="result">

BMI　　　　－<br>
判定　　　－<br>
標準体重　－<br>
肥満度　　－

</div>

<table>

<tr>
<th>BMI</th>
<th>判定</th>
</tr>

<tr><td>18.5未満</td><td>低体重（やせ）</td></tr>
<tr><td>18.5～24.9</td><td>普通体重</td></tr>
<tr><td>25.0～29.9</td><td>肥満（1度）</td></tr>
<tr><td>30.0～34.9</td><td>肥満（2度）</td></tr>
<tr><td>35.0～39.9</td><td>肥満（3度）</td></tr>
<tr><td>40.0以上</td><td>肥満（4度）</td></tr>

</table>

<div class="note">
※判定は日本肥満学会の基準です。
</div>

</div>

<a href="index.html" class="back-button">
🏠戻る
</a>

<script>

function calcBMI(){

    let height =
    Number(document.getElementById("height").value);

    let weight =
    Number(document.getElementById("weight").value);

    if(height<=0){

        alert("身長を入力してください");

        return;

    }

    if(weight<=0){

        alert("体重を入力してください");

        return;

    }

    let h =
    height / 100;

    let bmi =
    weight / (h * h);

    let standard =
    22 * h * h;

    let obesity =
    ((weight - standard) / standard) * 100;

    let judge="";

    if(bmi<18.5){

        judge="低体重（やせ）";

    }else if(bmi<25){

        judge="普通体重";

    }else if(bmi<30){

        judge="肥満（1度）";

    }else if(bmi<35){

        judge="肥満（2度）";

    }else if(bmi<40){

        judge="肥満（3度）";

    }else{

        judge="肥満（4度）";

    }

    document.getElementById("result").innerHTML=

    "BMI　　　　"+bmi.toFixed(1)+"<br>"+
    "判定　　　"+judge+"<br>"+
    "標準体重　"+standard.toFixed(1)+" kg<br>"+
    "肥満度　　"+obesity.toFixed(1)+" %";

}

function resetForm(){

    document.getElementById("height").value="";

    document.getElementById("weight").value="";

    document.getElementById("result").innerHTML=

    "BMI　　　　－<br>"+
    "判定　　　－<br>"+
    "標準体重　－<br>"+
    "肥満度　　－";

}

function goHome(){

    location.href="index.html";

}

</script>

</body>

</html>
