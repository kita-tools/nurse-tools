<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>看護ツール インストール紹介</title>

<style>

body{

    font-family:sans-serif;
    text-align:center;
    background:#f2f7fa;
    margin:0;

}

.box{

    background:white;
    margin:30px auto;
    padding:25px;
    border-radius:15px;
    width:85%;
    max-width:360px;

}

h2{

    margin-top:5px;

}


#qrcode{

    margin:20px auto;

}


.url{

    font-size:14px;
    word-break:break-all;
    background:#eee;
    padding:10px;
    border-radius:8px;

}


button{

    font-size:18px;
    padding:10px 25px;
    margin:10px;
    border-radius:10px;
    border:none;

}


.install{

    background:#4CAF50;
    color:white;

}


.copy{

    background:#2196F3;
    color:white;

}


.back{

    background:#777;
    color:white;

}


</style>

</head>


<body>


<div class="box">


<h2>
看護ツール
</h2>


<p>
スマホにインストールできます
</p>



<div id="qrcode"></div>



<div class="url" id="url">

https://kita-tools.github.io/nurse-tools/

</div>



<button class="install" onclick="installApp()">

📲 インストール

</button>


<br>


<button class="copy" onclick="copyURL()">

🔗 URLコピー

</button>


<br>


<button class="back" onclick="history.back()">

戻る

</button>



</div>




<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>


// QRコード常時表示

new QRCode(
document.getElementById("qrcode"),
{
    text:"https://kita-tools.github.io/nurse-tools/",
    width:180,
    height:180
}
);



let deferredPrompt;



// PWAインストール準備

window.addEventListener(
"beforeinstallprompt",
(e)=>{

    e.preventDefault();

    deferredPrompt=e;

}

);



// インストール要求

function installApp(){


if(deferredPrompt){

    deferredPrompt.prompt();


    deferredPrompt.userChoice.then(()=>{

        deferredPrompt=null;

    });


}

}




// URLコピー

function copyURL(){


navigator.clipboard.writeText(

"https://kita-tools.github.io/nurse-tools/"

);


alert("URLをコピーしました");

}



</script>


</body>

</html>
