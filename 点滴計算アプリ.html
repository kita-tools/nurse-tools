<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>点滴計算</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/calc.css">


<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SPCWDVP7F5"></script>

<script>

window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-SPCWDVP7F5');

</script>


<style>

.drop-svg{

    width:40px;

    height:50px;

    vertical-align:middle;

    margin-right:8px;

}

</style>


</head>


<body>


<header>

<svg class="drop-svg" viewBox="0 0 40 50">

<path d="
M20 2
C20 2 5 22 5 32
C5 42 12 48 20 48
C28 48 35 42 35 32
C35 22 20 2 20 2Z"

fill="#2196f3"/>

</svg>

点滴計算

</header>



<div class="box">



<div class="input-row">

<label>滴下量</label>

<input id="ml" type="number">

<span class="unit">mL</span>

</div>



<div class="input-row">

<label>滴下時間</label>

<input id="hour" type="number" min="0.1" step="0.1">

<span class="unit">時間</span>

</div>



<div class="input-row">

<label>滴下係数</label>

<select id="type">

<option value="20">20滴</option>

<option value="60">60滴</option>

</select>

<span class="unit">/mL</span>

</div>



<button onclick="start()">

開始

</button>



<div class="result" id="result">

輸液速度　－<br>
滴下速度　－<br>
滴下間隔　－

</div>



<div id="drop"></div>



<button id="mute" onclick="toggleMute()">

🔇

</button>



</div>



<a href="index.html" class="back-button">

🏠戻る

</a>





<script>


let timer;

let mute = true;

let audioCtx;




function start(){


    let ml =
    Number(document.getElementById("ml").value);


    let hour =
    Number(document.getElementById("hour").value);


    let drip =
    Number(document.getElementById("type").value);



    if(ml <= 0){

        alert("滴下量を入力してください");

        return;

    }



    if(isNaN(hour) || hour < 0.1){

        alert("滴下時間は0.1時間以上で入力してください");

        return;

    }



    let perMin =
    (ml * drip) / (hour * 60);



    let per10 =
    perMin / 6;



    let dropInterval =
    10000 / per10;



    document.getElementById("result").innerHTML =

    "輸液速度　"
    + (ml / hour).toFixed(1)
    + " mL/h<br>"

    +

    "滴下速度　"
    + per10.toFixed(2)
    + "滴/10秒<br>"

    +

    "滴下間隔　"
    + (dropInterval / 1000).toFixed(2)
    + "秒/滴";



    clearInterval(timer);



    drop();



    timer = setInterval(drop, dropInterval);


}





function drop(){


    let d =
    document.getElementById("drop");



    d.innerHTML = `

<svg class="drop-svg" viewBox="0 0 40 50">

<path d="
M20 2
C20 2 5 22 5 32
C5 42 12 48 20 48
C28 48 35 42 35 32
C35 22 20 2 20 2Z"

fill="#2196f3"/>

</svg>

`;



    if(!mute){

        beep();

    }



    setTimeout(function(){

        d.innerHTML="";

    },150);


}





function beep(){


    if(!audioCtx){

        audioCtx = new AudioContext();

    }



    let osc =
    audioCtx.createOscillator();



    osc.connect(audioCtx.destination);



    osc.frequency.value=800;



    osc.start();



    osc.stop(audioCtx.currentTime + 0.05);


}





function toggleMute(){


    mute = !mute;



    document.getElementById("mute").innerHTML =

    mute ? "🔇" : "🔈";


}



</script>


</body>

</html>
