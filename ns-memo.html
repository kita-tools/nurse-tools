<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>患者メモ ＆ タイマー - NsTools</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --radius-main: 10px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px 14px 40px 14px;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* Header */
        header {
            background: #0284c7;
            color: #fff;
            padding: 12px 14px;
            border-radius: var(--radius-main);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-icon {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .sound-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
        }
        .sound-toggle-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            font-variant-numeric: tabular-nums;
        }

        /* 俯瞰ナビゲーションボード（クイックジャンプ） */
        .quick-nav-card {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quick-nav-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            padding-bottom: 2px;
        }

        .nav-chip {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s, border-color 0.15s;
            text-decoration: none;
            color: var(--text-main);
            gap: 4px;
        }
        .nav-chip:hover { background: #e2e8f0; }

        .nav-chip.st-running { background: #f0f9ff; border-color: #bae6fd; color: #0369a1; }
        .nav-chip.st-warning { background: #fffbeb; border-color: #fde68a; color: #b45309; }
        .nav-chip.st-finished { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

        .nav-chip-left {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
            flex: 1;
        }

        .nav-chip-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
            max-width: 55px;
        }

        .nav-chip-memo {
            font-size: 10px;
            font-weight: normal;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55px;
        }

        .nav-chip-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .nav-chip-time {
            font-size: 10px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Top Action Bar */
        .top-action-bar {
            background: var(--card-bg);
            padding: 8px;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
        }
        .btn-add:hover { background: var(--primary-hover); }

        .btn-reset-all {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
        }
        .btn-reset-all:hover { background: #475569; }

        /* 患者管理カードグリッド */
        .patient-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .patient-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-main);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            position: relative;
            scroll-margin-top: 10px;
        }

        .patient-card.timer-running {
            border-left: 5px solid var(--primary);
            background: #f0f9ff;
        }
        .patient-card.timer-warning {
            border-left: 5px solid #d97706;
            background: #fffbeb;
        }
        .patient-card.timer-finished {
            border-left: 5px solid #dc2626;
            background: #fef2f2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .patient-title-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .patient-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .patient-name-input {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            border: 1px solid transparent;
            background: transparent;
            padding: 2px 4px;
            border-radius: 4px;
            width: 100px;
        }
        .patient-name-input:hover, .patient-name-input:focus {
            background: #fff;
            border-color: var(--border-color);
            outline: none;
        }

        .card-header-actions {
            display: flex;
            gap: 4px;
        }

        /* バイタル入力ブロック */
        .vitals-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 2px;
            border-bottom: 1px dashed var(--border-color);
        }

        .vitals-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vital-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 6px;
        }

        .vital-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .vital-input {
            width: 100%;
            border: none;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            outline: none;
            background: transparent;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .vital-unit {
            font-size: 10px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        /* 血圧セクション（2回測定） */
        .bp-block {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bp-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .bp-line-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            width: 38px;
            flex-shrink: 0;
        }

        .bp-inputs-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .bp-num-input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3px;
            font-size: 12px;
            text-align: center;
            font-weight: 700;
            background: #fff;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }
        .bp-num-input:focus { border-color: var(--primary); outline: none; }

        .bp-avg-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0f2fe;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: 700;
            color: #0369a1;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        /* memo欄 */
        .memo-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            background: #fff;
            color: var(--text-main);
            resize: none;
            height: 32px;
            line-height: 1.3;
        }
        .memo-input:focus { outline: none; border-color: var(--primary); }

        /* タイマー連携セクション */
        .timer-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 2px;
            border-top: 1px dashed var(--border-color);
        }

        .timer-display-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .timer-display-area:hover {
            background: #f1f5f9;
        }

        .timer-time {
            font-size: 18px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            line-height: 1.1;
        }

        .timer-status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }
        .st-run { color: #0284c7; background: #e0f2fe; }
        .st-warn { color: #b45309; background: #fef3c7; }
        .st-fin { color: #b91c1c; background: #fee2e2; }
        .st-stop { color: #64748b; background: #f1f5f9; }

        .timer-controls-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .timer-select-box {
            padding: 5px 2px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            width: 74px;
            text-align: center;
        }

        .t-btn {
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .btn-t-start { background: var(--primary); color: white; }
        .btn-t-pause { background: #d97706; color: white; }
        .btn-t-reset { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-reset-card { background: #f1f5f9; color: #475569; border: 1px solid var(--border-color); }
        .btn-del-card { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        /* サマリーカード */
        .stats-card {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-color);
            font-size: 12px;
        }
        .stats-title { font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; color: var(--text-main); }
        .stats-row { display: flex; justify-content: space-between; color: var(--text-sub); margin-bottom: 3px; }
        .stats-row span:last-child { font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }

        .app-footer { text-align: center; font-size: 11px; color: var(--text-sub); padding: 10px 0; }

        /* 右下の固定ポップアップボタン群（重ならないように上下に配置） */
        .floating-buttons {
            position: fixed;
            bottom: 20px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
        }

        .float-btn {
            background: var(--primary);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: var(--shadow-md);
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }
        .float-btn:hover {
            background: var(--primary-hover);
        }

        /* トップへ戻るボタン（初期は非表示） */
        #backToTopBtn {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s, visibility 0.25s, background 0.2s;
        }
        #backToTopBtn.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="top">
        <div class="header-top">
            <div class="header-title-area">
                <div class="header-icon">📋</div>
                <h1>患者メモ ＆ タイマー</h1>
            </div>
            <button class="sound-toggle-btn" onclick="toggleSound()">
                <span id="sound-icon">🔔</span> <span id="sound-txt">ON</span>
            </button>
        </div>
        <div class="header-bottom">
            <span id="current-clock">--/--/--（-） --:--</span>
            <span>NsTools 臨床支援</span>
        </div>
    </header>

    <!-- クイックナビゲーションボード (俯瞰＆ジャンプ) -->
    <div class="quick-nav-card">
        <div class="quick-nav-title">
            <span>クイックナビ（タップして移動）</span>
            <span id="nav-total-count">0名</span>
        </div>
        <div class="quick-nav-grid" id="quick-nav-container"></div>
    </div>

    <!-- Top Action Bar -->
    <div class="top-action-bar">
        <button class="btn-add" onclick="addPatientCard()">
            <span>＋</span> 患者を追加
        </button>
        <button class="btn-reset-all" onclick="resetAllPatientsData()">
            <span>🔄</span> 一括リセット
        </button>
    </div>

    <!-- Patient Cards Container -->
    <div class="patient-grid" id="patient-container"></div>

    <!-- Stats Summary -->
    <div class="stats-card">
        <div class="stats-title">状況サマリー</div>
        <div class="stats-row"><span>登録患者数</span><span id="stat-total">0名</span></div>
        <div class="stats-row"><span>タイマー稼働中</span><span id="stat-running">0名</span></div>
        <div class="stats-row"><span>タイマー終了</span><span id="stat-finished">0名</span></div>
    </div>

    <div class="app-footer">
        NsTools / バイタル・タイマー一体型管理システム
    </div>

    <!-- 右下のフローティングボタン群（Indexに戻る ＆ 上に戻る） -->
    <div class="floating-buttons">
        <!-- Indexに戻るボタン（必要に応じてhrefのリンク先を変更してください。例: index.html） -->
        <a href="index.html" class="float-btn" title="Indexに戻る">INDEX</a>
        <!-- 上に戻るボタン -->
        <a href="#top" class="float-btn" id="backToTopBtn" title="トップへ戻る">▲TOP</a>
    </div>

    <script>
        let patients = [];
        let soundOn = true;

        const DEFAULT_PATIENTS = [
            { id: 1, name: "Aさん", temp: "", pulse: "", sys1: "", dia1: "", sys2: "", dia2: "", memo: "", duration: 600, remaining: 600, endTime: null, state: "stopped" },
            { id: 2, name: "Bさん", temp: "", pulse: "", sys1: "", dia1: "", sys2: "", dia2: "", memo: "", duration: 600, remaining: 600, endTime: null, state: "stopped" },
            { id: 3, name: "Cさん", temp: "", pulse: "", sys1: "", dia1: "", sys2: "", dia2: "", memo: "", duration: 600, remaining: 600, endTime: null, state: "stopped" },
            { id: 4, name: "Dさん", temp: "", pulse: "", sys1: "", dia1: "", sys2: "", dia2: "", memo: "", duration: 600, remaining: 600, endTime: null, state: "stopped" }
        ];

        function loadData() {
            const saved = localStorage.getItem('nstools_patient_memo_v15');
            if (saved) {
                try { 
                    patients = JSON.parse(saved); 
                    updateAllTimersQuiet();
                } catch(e) { patients = JSON.parse(JSON.stringify(DEFAULT_PATIENTS)); }
            } else {
                patients = JSON.parse(JSON.stringify(DEFAULT_PATIENTS));
            }
        }

        function saveData() {
            localStorage.setItem('nstools_patient_memo_v15', JSON.stringify(patients));
        }

        function tickTimers() {
            const now = Date.now();
            let needFullRender = false;
            let needAlarm = false;

            patients.forEach(p => {
                if (p.state === 'running' && p.endTime) {
                    const diffSec = Math.ceil((p.endTime - now) / 1000);
                    if (diffSec <= 0) {
                        p.remaining = 0;
                        p.state = 'finished';
                        p.endTime = null;
                        needFullRender = true;
                        needAlarm = true;
                    } else {
                        const oldRem = p.remaining;
                        p.remaining = diffSec;
                        if ((oldRem > 60 && diffSec <= 60) || (oldRem <= 60 && diffSec > 60)) {
                            needFullRender = true;
                        }
                    }
                }
            });

            const activeEl = document.activeElement;
            const isUserTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');

            if (needFullRender && !isUserTyping) {
                saveData();
                renderPatients();
                if (needAlarm) playAlarm();
            } else {
                updateTimersDOMOnly();
            }
        }

        function updateTimersDOMOnly() {
            const now = Date.now();
            patients.forEach(p => {
                if (p.state === 'running' && p.endTime) {
                    const diffSec = Math.max(0, Math.ceil((p.endTime - now) / 1000));
                    p.remaining = diffSec;
                }

                const card = document.getElementById(`patient-card-${p.id}`);
                if (card) {
                    const mins = Math.floor(p.remaining / 60);
                    const secs = p.remaining % 60;
                    const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                    const timeEl = card.querySelector('.timer-time');
                    if (timeEl) {
                        timeEl.textContent = (p.state === 'stopped' && p.remaining === p.duration) ? `${String(Math.floor(p.duration/60)).padStart(2,'0')}:00` : timeStr;
                    }
                }

                const navTimeEl = document.getElementById(`nav-time-${p.id}`);
                if (navTimeEl) {
                    const mins = Math.floor(p.remaining / 60);
                    const secs = p.remaining % 60;
                    const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    navTimeEl.textContent = (p.state === 'finished') ? '終了！' : ((p.state === 'stopped' && p.remaining === p.duration) ? `${Math.floor(p.duration/60)}分` : timeStr);
                }
            });
        }

        function updateAllTimersQuiet() {
            const now = Date.now();
            patients.forEach(p => {
                if (p.state === 'running' && p.endTime) {
                    const diffSec = Math.ceil((p.endTime - now) / 1000);
                    if (diffSec <= 0) {
                        p.remaining = 0;
                        p.state = 'finished';
                        p.endTime = null;
                    } else {
                        p.remaining = diffSec;
                    }
                }
            });
            saveData();
        }

        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const w = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-clock').textContent = `${y}/${m}/${d}（${w}） ${hh}:${mm}:${ss}`;

            tickTimers();
        }
        setInterval(updateClock, 1000);

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            if (window.scrollY > 200) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        });

        function formatMemoSnippet(memo) {
            if (!memo || memo.trim() === '') return '';
            const clean = memo.trim();
            if (clean.length > 4) {
                return clean.substring(0, 4) + '…';
            }
            return clean;
        }

        function renderPatients() {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
                return;
            }

            const container = document.getElementById('patient-container');
            const navContainer = document.getElementById('quick-nav-container');
            container.innerHTML = '';
            navContainer.innerHTML = '';

            let runningCount = 0;
            let finishedCount = 0;

            patients.forEach((p, index) => {
                let avgSys = "--", avgDia = "--";
                const s1 = parseFloat(p.sys1), d1 = parseFloat(p.dia1);
                const s2 = parseFloat(p.sys2), d2 = parseFloat(p.dia2);
                const has1 = !isNaN(s1) && !isNaN(d1);
                const has2 = !isNaN(s2) && !isNaN(d2);

                if (has1 && has2) {
                    avgSys = Math.round((s1 + s2) / 2);
                    avgDia = Math.round((d1 + d2) / 2);
                } else if (has1) {
                    avgSys = s1; avgDia = d1;
                } else if (has2) {
                    avgSys = s2; avgDia = d2;
                }

                let cardClass = "";
                let statusBadge = `<span class="timer-status-badge st-stop">未開始</span>`;
                let navChipClass = "";
                let navTimeText = `${Math.floor(p.duration / 60)}分`;
                let timeMins = Math.floor(p.remaining / 60);
                let timeSecs = p.remaining % 60;
                let timeStr = `${String(timeMins).padStart(2, '0')}:${String(timeSecs).padStart(2, '0')}`;

                if (p.state === 'running') {
                    if (p.remaining <= 60) {
                        cardClass = "timer-warning";
                        statusBadge = `<span class="timer-status-badge st-warn">残りわずか</span>`;
                        navChipClass = "st-warning";
                    } else {
                        cardClass = "timer-running";
                        statusBadge = `<span class="timer-status-badge st-run">タイマー中</span>`;
                        navChipClass = "st-running";
                    }
                    navTimeText = timeStr;
                    runningCount++;
                } else if (p.state === 'finished') {
                    cardClass = "timer-finished";
                    statusBadge = `<span class="timer-status-badge st-fin">終了！</span>`;
                    navChipClass = "st-finished";
                    navTimeText = "終了！";
                    timeStr = "00:00";
                    finishedCount++;
                } else if (p.state === 'paused') {
                    statusBadge = `<span class="timer-status-badge st-stop">停止中</span>`;
                    navTimeText = timeStr;
                }

                const memoSnippet = formatMemoSnippet(p.memo);

                const navChip = document.createElement('a');
                navChip.className = `nav-chip ${navChipClass}`;
                navChip.href = `#patient-card-${p.id}`;
                navChip.innerHTML = `
                    <div class="nav-chip-left">
                        <span class="nav-chip-name">${index + 1}.${escapeHtml(p.name)}</span>
                        ${memoSnippet ? `<span class="nav-chip-memo">[${escapeHtml(memoSnippet)}]</span>` : ''}
                    </div>
                    <div class="nav-chip-right">
                        <span class="nav-chip-time" id="nav-time-${p.id}">${navTimeText}</span>
                    </div>
                `;
                navContainer.appendChild(navChip);

                const currentMins = Math.round(p.duration / 60) || 10;
                const presetMins = [3, 5, 10, 15, 30, 60, 120];
                const selectVal = presetMins.includes(currentMins) ? currentMins : 'custom';

                const card = document.createElement('div');
                card.className = `patient-card ${cardClass}`;
                card.id = `patient-card-${p.id}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="patient-title-area">
                            <div class="patient-badge">${index + 1}</div>
                            <input type="text" class="patient-name-input" lang="ja" value="${escapeHtml(p.name)}" oninput="updateField(${p.id}, 'name', this.value)" onblur="renderPatients()" placeholder="患者名">
                        </div>
                        <div class="card-header-actions">
                            <button class="t-btn btn-reset-card" onclick="resetPatientData(${p.id})">リセット</button>
                            <button class="t-btn btn-del-card" onclick="deletePatient(${p.id})">削除</button>
                        </div>
                    </div>

                    <!-- バイタル入力部 -->
                    <div class="vitals-section">
                        <div class="vitals-row">
                            <div class="vital-item">
                                <span class="vital-label">体温</span>
                                <input type="number" step="0.1" class="vital-input" value="${p.temp}" oninput="updateField(${p.id}, 'temp', this.value)" placeholder="--.-">
                                <span class="vital-unit">℃</span>
                            </div>
                            <div class="vital-item">
                                <span class="vital-label">脈拍</span>
                                <input type="number" class="vital-input" value="${p.pulse}" oninput="updateField(${p.id}, 'pulse', this.value)" placeholder="---">
                                <span class="vital-unit">/分</span>
                            </div>
                        </div>

                        <!-- 血圧（2回測定＋平均） -->
                        <div class="bp-block">
                            <div class="bp-line">
                                <span class="bp-line-label">1回目</span>
                                <div class="bp-inputs-wrap">
                                    <input type="number" class="bp-num-input" id="sys1-${p.id}" value="${p.sys1}" oninput="updateBpField(${p.id})" placeholder="最高">
                                    <span style="color:var(--text-sub); font-size:11px;">/</span>
                                    <input type="number" class="bp-num-input" id="dia1-${p.id}" value="${p.dia1}" oninput="updateBpField(${p.id})" placeholder="最低">
                                </div>
                            </div>
                            <div class="bp-line">
                                <span class="bp-line-label">2回目</span>
                                <div class="bp-inputs-wrap">
                                    <input type="number" class="bp-num-input" id="sys2-${p.id}" value="${p.sys2}" oninput="updateBpField(${p.id})" placeholder="最高">
                                    <span style="color:var(--text-sub); font-size:11px;">/</span>
                                    <input type="number" class="bp-num-input" id="dia2-${p.id}" value="${p.dia2}" oninput="updateBpField(${p.id})" placeholder="最低">
                                </div>
                            </div>
                            <div class="bp-avg-display" id="bp-avg-${p.id}">
                                <span>2回平均</span>
                                <span style="font-size:11px; font-weight:bold;">${avgSys} / ${avgDia} <span style="font-size:9px; font-weight:normal;">mmHg</span></span>
                            </div>
                        </div>
                    </div>

                    <!-- memo欄 -->
                    <div>
                        <textarea class="memo-input" lang="ja" placeholder="memo（例：点滴残り時間、検査指示など）" oninput="updateField(${p.id}, 'memo', this.value)" onblur="renderPatients()">${escapeHtml(p.memo)}</textarea>
                    </div>

                    <!-- タイマー機能 -->
                    <div class="timer-section">
                        <div class="timer-display-area" onclick="promptDirectMinute(${p.id})" title="タップして時間を直接変更">
                            <div class="timer-time">${timeStr}</div>
                            ${statusBadge}
                        </div>

                        <div class="timer-controls-right">
                            <select class="timer-select-box" onchange="handleTimerSelection(${p.id}, this.value)">
                                <option value="3" ${selectVal===3?'selected':''}>3分</option>
                                <option value="5" ${selectVal===5?'selected':''}>5分</option>
                                <option value="10" ${selectVal===10?'selected':''}>10分</option>
                                <option value="15" ${selectVal===15?'selected':''}>15分</option>
                                <option value="30" ${selectVal===30?'selected':''}>30分</option>
                                <option value="60" ${selectVal===60?'selected':''}>60分</option>
                                <option value="120" ${selectVal===120?'selected':''}>120分</option>
                                <option value="custom" ${selectVal==='custom'?'selected':''}>手入(${currentMins}分)</option>
                            </select>

                            ${p.state === 'running' ? `
                                <button class="t-btn btn-t-pause" onclick="pauseTimer(${p.id})">停止</button>
                            ` : `
                                <button class="t-btn btn-t-start" onclick="startTimer(${p.id})">${p.state === 'finished' ? '再開' : '開始'}</button>
                            `}
                            <button class="t-btn btn-t-reset" onclick="resetTimer(${p.id})">クリア</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('nav-total-count').textContent = `${patients.length}名`;
            document.getElementById('stat-total').textContent = `${patients.length}名`;
            document.getElementById('stat-running').textContent = `${runningCount}名`;
            document.getElementById('stat-finished').textContent = `${finishedCount}名`;
        }

        function updateField(id, field, val) {
            const p = patients.find(item => item.id === id);
            if (p) {
                p[field] = val;
                saveData();
            }
        }

        function updateBpField(id) {
            const p = patients.find(item => item.id === id);
            if (!p) return;

            p.sys1 = document.getElementById(`sys1-${id}`).value;
            p.dia1 = document.getElementById(`dia1-${id}`).value;
            p.sys2 = document.getElementById(`sys2-${id}`).value;
            p.dia2 = document.getElementById(`dia2-${id}`).value;
            saveData();

            let avgSys = "--", avgDia = "--";
            const s1 = parseFloat(p.sys1), d1 = parseFloat(p.dia1);
            const s2 = parseFloat(p.sys2), d2 = parseFloat(p.dia2);
            const has1 = !isNaN(s1) && !isNaN(d1);
            const has2 = !isNaN(s2) && !isNaN(d2);

            if (has1 && has2) {
                avgSys = Math.round((s1 + s2) / 2);
                avgDia = Math.round((d1 + d2) / 2);
            } else if (has1) {
                avgSys = s1; avgDia = d1;
            } else if (has2) {
                avgSys = s2; avgDia = d2;
            }

            const avgBox = document.getElementById(`bp-avg-${id}`);
            if (avgBox) {
                avgBox.innerHTML = `
                    <span>2回平均</span>
                    <span style="font-size:11px; font-weight:bold;">${avgSys} / ${avgDia} <span style="font-size:9px; font-weight:normal;">mmHg</span></span>
                `;
            }
        }

        function promptDirectMinute(id) {
            const p = patients.find(item => item.id === id);
            if (!p) return;
            const currentMins = Math.round(p.duration / 60);
            const inputVal = prompt("タイマーの時間を分単位で入力してください:", currentMins);
            if (inputVal !== null) {
                const mins = parseInt(inputVal);
                if (!isNaN(mins) && mins > 0) {
                    const secs = mins * 60;
                    p.duration = secs;
                    if (p.state !== 'running') {
                        p.remaining = secs;
                    }
                    saveData();
                    renderPatients();
                }
            }
        }

        function handleTimerSelection(id, val) {
            const p = patients.find(item => item.id === id);
            if (!p) return;

            if (val === 'custom') {
                promptDirectMinute(id);
            } else {
                const mins = parseInt(val);
                const secs = mins * 60;
                p.duration = secs;
                if (p.state !== 'running') p.remaining = secs;
                saveData();
                renderPatients();
            }
        }

        function startTimer(id) {
            const p = patients.find(item => item.id === id);
            if (p) {
                if (p.remaining <= 0) p.remaining = p.duration;
                p.state = 'running';
                p.endTime = Date.now() + (p.remaining * 1000);
                saveData();
                renderPatients();
            }
        }

        function pauseTimer(id) {
            const p = patients.find(item => item.id === id);
            if (p) {
                p.state = 'paused';
                p.endTime = null;
                saveData();
                renderPatients();
            }
        }

        function resetTimer(id) {
            const p = patients.find(item => item.id === id);
            if (p) {
                p.state = 'stopped';
                p.remaining = p.duration;
                p.endTime = null;
                saveData();
                renderPatients();
            }
        }

        function resetPatientData(id) {
            const p = patients.find(item => item.id === id);
            if (p && confirm(`${p.name}のバイタル・メモ等の入力データをリセットしますか？`)) {
                p.temp = "";
                p.pulse = "";
                p.sys1 = ""; p.dia1 = "";
                p.sys2 = ""; p.dia2 = "";
                p.memo = "";
                p.state = "stopped";
                p.remaining = p.duration;
                p.endTime = null;
                saveData();
                renderPatients();
            }
        }

        function addPatientCard() {
            const newId = patients.length > 0 ? Math.max(...patients.map(p => p.id)) + 1 : 1;
            const nextLetter = String.fromCharCode(65 + (patients.length % 26));
            patients.push({
                id: newId,
                name: `${nextLetter}さん`,
                temp: "",
                pulse: "",
                sys1: "", dia1: "",
                sys2: "", dia2: "",
                memo: "",
                duration: 600,
                remaining: 600,
                endTime: null,
                state: "stopped"
            });
            saveData();
            renderPatients();
        }

        function resetAllPatientsData() {
            if (confirm("すべての患者の入力データとタイマーをリセットし、A〜Dさんの初期状態に戻しますか？")) {
                patients = JSON.parse(JSON.stringify(DEFAULT_PATIENTS));
                saveData();
                renderPatients();
            }
        }

        function deletePatient(id) {
            if (confirm("この患者カードを削除しますか？")) {
                patients = patients.filter(item => item.id !== id);
                saveData();
                renderPatients();
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('sound-txt').textContent = soundOn ? "ON" : "OFF";
            document.getElementById('sound-icon').textContent = soundOn ? "🔔" : "🔕";
        }

        function playAlarm() {
            if (!soundOn) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                let count = 0;
                function beepSequence() {
                    if (count >= 10) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, ctx.currentTime);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                    count++;
                    setTimeout(beepSequence, 220);
                }
                beepSequence();
            } catch(e) {}
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadData();
        renderPatients();
        updateClock();
    </script>
</body>
</html>
