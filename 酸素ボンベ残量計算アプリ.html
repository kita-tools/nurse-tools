<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>酸素ボンベ残量計算</title>


<link rel="stylesheet" href="css/common.css">

<link rel="stylesheet" href="css/calc.css">


</head>


<body>


<div class="box">


<h2>酸素ボンベ残量計算</h2>



<div class="input-row">

<label>内容積</label>

<select id="capacity">

<option value="3.4">
3.4L（500L）
</option>

<option value="10" selected>
10L（1500L）
</option>

<option value="20">
20L（3000L）
</option>

</select>

</div>




<div class="input-row">

<label>現在圧力</label>

<input 
id="pressure"
type="number"
value="14.7"
step="0.1">

<span class="unit">
MPa
</span>

</div>




<div class="input-row">

<label>流量</label>

<input 
id="flow"
type="number"
step="0.1">

<span class="unit">
L/分
</span>

</div>




<div class="input-row">

<label>交換圧力</label>

<input
id="changePressure"
type="number"
value="2"
step="0.1">

<span class="unit">
MPa
</span>

</div>




<button onclick="calc()">

計算

</button>



<div id="result">

結果表示

</div>



</div>



<a href="index.html" class="back-button">

🏠戻る

</a>
<script>


function calc(){


    let capacity =
    Number(document.getElementById("capacity").value);


    let pressure =
    Number(document.getElementById("pressure").value);


    let flow =
    Number(document.getElementById("flow").value);


    let changePressure =
    Number(document.getElementById("changePressure").value);



    if(flow <= 0){

        alert("流量を入力してください");

        return;

    }


    if(pressure <= changePressure){

        document.getElementById("result").innerHTML =

        "⚠ 交換圧力以下です<br><br>" +

        "現在圧力 " +
        pressure.toFixed(1) +
        " MPa";


        return;

    }



    // 使用可能酸素量
    // 交換圧力まで使用

    let oxygen =

    capacity *
    (pressure - changePressure) *
    10;



    // 使用可能時間（分）

    let minutes =

    oxygen / flow;



    let hour =

    Math.floor(minutes / 60);



    let min =

    Math.floor(minutes % 60);




    // 現在時刻

    let now = new Date();


    let nowText =

    now.getFullYear()
    + "年"
    + (now.getMonth()+1)
    + "月"
    + now.getDate()
    + "日 "
    + String(now.getHours()).padStart(2,"0")
    + "時"
    + String(now.getMinutes()).padStart(2,"0")
    + "分";




    // 交換予想時間

    let end = new Date();


    end.setMinutes(

        end.getMinutes()
        + minutes

    );



    let endText =

    end.getFullYear()
    + "年"
    + (end.getMonth()+1)
    + "月"
    + end.getDate()
    + "日 "
    + String(end.getHours()).padStart(2,"0")
    + "時"
    + String(end.getMinutes()).padStart(2,"0")
    + "分";





    document.getElementById("result").innerHTML =


    "現在時刻<br>"
    + nowText
    + "<br><br>"


    + "酸素残量（交換まで）<br>"
    + oxygen.toFixed(0)
    + " L"
    + "<br><br>"


    + "交換まで<br>"
    + hour
    + "時間 "
    + min
    + "分"
    + "<br><br>"


    + "交換予想時間<br>"
    + endText
    + "<br><br>"


    + "※設定した交換圧力 "
    + changePressure.toFixed(1)
    + "MPaまでの計算です"
    + "<br>"
    + "※実際の使用時は残圧計を確認してください";


}


</script>


</body>

</html>
